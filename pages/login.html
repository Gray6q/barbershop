<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314120f'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%23c9974a' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="robots" content="noindex">
  <title>Log in – Your Barbershop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="page">

  <div class="page__stripe"></div>

  <header class="header">
    <div class="header__inner">
      <a class="header__logo" href="../index.html">Your <span class="header__logo-accent">Barbershop</span></a>
      <button class="header__toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span class="header__toggle-bar"></span>
        <span class="header__toggle-bar"></span>
        <span class="header__toggle-bar"></span>
      </button>
      <nav class="header__nav" id="menu">
        <a class="header__link" href="../index.html#services">Services</a>
        <a class="header__link" href="../index.html#why-us">Why us</a>
        <a class="header__link" href="../index.html#hours">Hours</a>
        <a class="header__link" href="../index.html#contact">Contact</a>
        <a class="header__link" href="login.html">Log in</a>
        <a class="btn btn--primary header__button" href="booking.html">Book now</a>
      </nav>
    </div>
  </header>

  <main class="auth">
    <div class="auth__inner">
      <h1 class="auth__title">Log in</h1>
      <p class="auth__text">Welcome back. Log in to see your bookings.</p>

      <form class="form" data-auth="login" novalidate>
        <div class="form__field">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
          <p class="form__error" data-error="email"></p>
        </div>

        <div class="form__field">
          <label class="form__label" for="password">Password</label>
          <input class="form__input" type="password" id="password" name="password" autocomplete="current-password">
          <p class="form__error" data-error="password"></p>
        </div>

        <button class="btn btn--primary form__submit" type="submit">Log in</button>
        <p class="form__message" id="form-message" role="status"></p>
      </form>

      <p class="auth__switch">No account yet? <a class="auth__link" href="register.html">Create one</a></p>
      <p class="auth__switch">Forgot your password? Call the salon and we will reset it for you.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>© Your Barbershop · <a class="footer__link" href="privacy.html">Privacy</a></span>
      <span>[INSTAGRAM] · [FACEBOOK]</span>
    </div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
